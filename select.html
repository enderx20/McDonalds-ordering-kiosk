<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="select.css">
    <title>Kiosk</title>
</head>
<body>
    <div class="main-buttons">
         <button class="button-left">
            <div class="button-container">
                <a class="button-text">Dine in</a>
                <img src="assets/dine-in.png", width="334", height="186,5">
            </div>
         </button>

            <div class="button-container">
                <a class="button-text">Take away</a>

    <div class="language">

        </button>

    <div class="control">

                <div class="control-button-div">
                    <img src="assets/accessibility.png" width="25", height="25">

                </div>

                
           </button>
        </a>
        <a href="index.html" class="href">
            <button class="control-button">

                </div>
