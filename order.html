<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="order.css">
    <script src="order.js" defer></script>
    <title>Kiosk - Order</title>
</head>
<body>
    <div class="menu">
        <div class="sidebar">
            <nav class="sidebar-nav">
                <button class="active" , data-tab="featured">
                    
                    <img src="assets/Featured.png" >
                    <span class="button-text">Featured</span>
                    
                </button>
                <button data-tab="breakfast">
                    <img src="assets/breakfast.png">
                    <span class="button-text">Breakfast</span>
                </button>
                <button data-tab="burger">
                    <img src="assets/burgers.png">
                    <span class="button-text">Burgers</span>
                </button>
                <button data-tab="nuggets">
                    <img src="assets/nuggets.png">
                    <span class="button-text">McNuggets® and Fingerfood</span>
                </button>
                <button data-tab="happy-meal">
                    <img src="assets/happy_meal.png">
                    <span class="button-text">Happy meal®</span>
                </button>
                <button data-tab="fries">
                    <img src="assets/fries.png">
                    <span class="button-text">Fries and Sides</span>
                </button>
                <button data-tab="drinks">
                    <img src="assets/drinks.png">
                    <span class="button-text">Drinks</span>
                </button>
            </nav>
        </div>
        <div class="content">
            <div id="featured", class="tab active">
                Featured
            </div>
            <div id="breakfast", class="tab">
                Breakfast
            </div>
            <div id="burger", class="tab">
                Burgers
            </div>
            <div id="nuggets", class="tab">
                Nuggets
            </div>
            <div id="happy-meal", class="tab">
                Happy meal
            </div>
            <div id="fries", class="tab">
                Fries
            </div>
            <div id="drinks", class="tab">
                Drinks
            </div>
        </div>
    </div>

    <div class="control">
        Control
    </div>
    
</body>
</html>
